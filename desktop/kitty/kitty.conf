font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font Bold
italic_font      FiraCode Nerd Font Italic
bold_italic_font FiraCode Nerd Font Bold Italic
font_size        13.0
enable_ligatures always

background            #0d0d0d
foreground            #c0caf5
selection_background  #283457
selection_foreground  #c0caf5
cursor                #c0caf5
cursor_text_color     #0d0d0d

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

window_padding_width 10
hide_window_decorations yes
cursor_shape block
cursor_blink_interval 0
repaint_delay 10
sync_to_monitor yes
scrollback_lines 10000
tab_bar_style powerline
tab_powerline_style slanted
